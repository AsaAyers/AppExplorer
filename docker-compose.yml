version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-explorer:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_CONTACT_FORM_URL=https://forms.gle/y7XqNbyrsps943sb7
      - ASSET_UPLOAD_ON_BOOT=false
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local
