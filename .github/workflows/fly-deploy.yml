# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          JWT_DATE: ${{ secrets.JWT_DATE }}
          JWT_2026_02_10_KEY: ${{ secrets.JWT_2026_02_10_KEY }}

  publish-extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          # Strip leading 'v'
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION, package.json=$PKG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Fetch built extension
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          # Strip leading 'v'
          TAG_VERSION="${TAG_VERSION#v}"
          curl --fail https://assets.appexplorer.dev/_next/static/app-explorer-$TAG_VERSION.vsix -O
      - name: Install vsce
        run: npm install -g vsce
      - name: Publish extension
        run: npx vsce publish --no-dependencies --packagePath app-explorer-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          SKIP_TESTS: "true"
